<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Aviary Ledger — A Field Archive of Birds</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Public+Sans:wght@300;400;500;600&family=Special+Elite&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body$body_style>

  <div class="bg-layer"></div>
  <div class="grain"></div>

  <header class="top">
    <div class="wordmark">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M10 60 Q30 20 50 45 Q70 20 90 60 Q65 50 50 68 Q35 50 10 60Z" fill="#C99A3E"/>
      </svg>
      THE AVIARY LEDGER
    </div>
    <div class="tag-eyebrow">Est. Field Archive</div>
  </header>

  <section class="hero">
    <div class="flock" id="flock"></div>
    <div class="hero-layout">
      <div class="hero-copy">
        <div class="hero-eyebrow">Vol. I — A Living Catalog</div>
        <h1 class="hero-title">Every bird<br>has a <em>dossier.</em></h1>
        <p class="hero-sub">
          Nine bird records for APM Aviary. Tap a card to view its hatch date, lifespan, wingspan, habitat, diet, and call.
        </p>
        <div class="hero-line"></div>
      </div>
      <div class="hero-logo-column">
        <div class="hero-logo-backdrop">
          <img
            class="hero-logo"
            src="images/apm-logo.png"
            alt="APM Aviary - Locally Bred Birds"
            width="480"
            height="480"
          >
        </div>
      </div>
    </div>
  </section>

  <form class="rail" action="/" method="get">
    <input type="hidden" name="f" value="$active_filter">
    <label class="rail-label" for="search">SEARCH LEDGER →</label>
    <input id="search" name="q" type="search" value="$query" placeholder="bird name or habitat…">
    <button type="submit" class="chip">Search</button>

    <div class="chipset" id="chips">
      <button type="submit" name="filter" value="all" class="chip$all_active">All</button>
      <button type="submit" name="filter" value="budgie" class="chip$budgie_active">Budgies</button>
      <button type="submit" name="filter" value="lovebird" class="chip$lovebird_active">Lovebirds</button>
    </div>
  </form>

  <main>
    <div class="grid" id="grid">$cards</div>
  </main>

  <footer>
    <p>THE AVIARY LEDGER · NINE SPECIMENS CATALOGED · HANDLE PAGES WITH CARE</p>
  </footer>

  $dossier
</body>
</html>
